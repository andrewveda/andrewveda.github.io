<style>

:root{
  --teal:#0e2a35;
  --gold:#b8922a;
  --bg:#f7f3ec;
  --ink:#1a1a18;
  --muted:#7a7468;
  --border:rgba(0,0,0,0.08);
  --serif:'Playfair Display', serif;
  --sans:'Instrument Sans', sans-serif;
}

*{margin:0;padding:0;box-sizing:border-box;}

body{
  font-family:var(--sans);
  display:flex;
  height:100vh;
}

/* ================= LEFT PAGE (FIXED) ================= */

.left{
  width:50%;
  background:var(--bg);
  padding:60px;
  position:sticky;
  top:0;
  height:100vh;
  overflow:hidden;
}

/* HEADER */

.header{
  display:flex;
  align-items:center;
  gap:18px;
  margin-bottom:20px;
}

.header img{
  width:70px;
  height:70px;
  object-fit:cover;
  border-radius:4px;
}

h1{
  font-family:var(--serif);
  font-size:2.6rem;
}

.role{
  font-size:0.75rem;
  color:var(--muted);
}

/* TAGLINE */

.tagline{
  font-style:italic;
  margin-bottom:30px;
  max-width:45ch;
}

/* PROJECT GRID */

.projects{
  display:grid;
  grid-template-columns:1fr 1fr;
  border:1px solid var(--border);
}

.card{
  padding:20px;
  border-right:1px solid var(--border);
  border-bottom:1px solid var(--border);
  background:white;
}

.card:nth-child(2n){
  border-right:none;
}

.card h3{
  font-family:var(--serif);
  font-size:1rem;
  margin-bottom:6px;
}

.card p{
  font-size:0.8rem;
  color:var(--muted);
  margin-bottom:10px;
}

.card a{
  font-size:0.75rem;
  color:var(--teal);
  text-transform:uppercase;
}

/* ================= RIGHT PAGE (SCROLLABLE) ================= */

.right{
  width:50%;
  height:100vh;
  overflow-y:auto;
  background:white;
}

/* TABS */

.tabs{
  position:sticky;
  top:0;
  background:white;
  display:flex;
  gap:20px;
  padding:20px 40px;
  border-bottom:1px solid var(--border);
  z-index:10;
}

.tab{
  font-size:0.75rem;
  letter-spacing:0.1em;
  text-transform:uppercase;
  cursor:pointer;
  color:var(--muted);
}

.tab.active{
  color:var(--gold);
  border-bottom:2px solid var(--gold);
}

/* CONTENT */

.viewer{
  padding:40px;
}

.slide{
  display:none;
  max-width:600px;
}

.slide.active{
  display:block;
}

.slide h2{
  font-family:var(--serif);
  font-size:1.8rem;
  margin-bottom:14px;
}

.slide p{
  margin-bottom:14px;
  line-height:1.7;
}

/* ================= MOBILE ================= */

@media(max-width:900px){
  body{flex-direction:column;}
  .left,.right{width:100%;height:auto;position:relative;}
}
/* ================= FOOTER ================= */

.footer-links {
  display: flex;
  gap: 24px;
  padding: 20px 40px;
  border-top: 1px solid rgba(0,0,0,0.08);

  overflow-x: auto;
  white-space: nowrap;
}

/* hide ugly scrollbar (optional, clean look) */
.footer-links::-webkit-scrollbar {
  height: 6px;
}
.footer-links::-webkit-scrollbar-thumb {
  background: rgba(0,0,0,0.15);
  border-radius: 3px;
}

/* links */
.footer-links a {
  font-size: 0.75rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
  text-decoration: none;

  transition: color 0.2s ease;
}

.footer-links a:hover {
  color: var(--gold);
}
  .footer-links a::after {
  content: "·";
  margin-left: 24px;
  color: rgba(0,0,0,0.2);
}

.footer-links a:last-child::after {
  content: "";
}

.footer-links a{

.footer-links a:hover{
